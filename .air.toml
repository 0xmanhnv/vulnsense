# .air.toml
# Config file for air: https://github.com/cosmtrek/air

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/vulnsense ./cmd/vulnsense/main.go"
  bin = "./tmp/vulnsense"
  full_bin = "./tmp/vulnsense"
  delay = 1000 # ms
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]
  log = "air.log"

[log]
  time = true

[misc]
  clean_on_exit = true 