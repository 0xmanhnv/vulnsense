version: '3.8'

services:
  # Service to run database migrations
  migrate:
    build: .
    command: >
      sh -c "
        ./wait-for-it.sh postgres:5432 --
        make migrate-up
      "
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - vulnsense_net

  # Service to run the scheduler process
  scheduler:
    build: .
    command: ["scheduler"]
    restart: always
    depends_on:
      - redis
    env_file:
      - .env
    networks:
      - vulnsense_net

  # Service to run the worker process
  worker:
    build: .
    command: ["vulnsense"]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    networks:
      - vulnsense_net

  # --- Infrastructure Services ---
  postgres:
    image: postgres:15-alpine
    container_name: vulnsense_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-vulnsense_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-vulnsense_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulnsense_net

  redis:
    image: redis:7-alpine
    container_name: vulnsense_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulnsense_net

volumes:
  postgres_data:
  redis_data:

networks:
  vulnsense_net:
    driver: bridge 